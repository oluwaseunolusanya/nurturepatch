services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: nurturepatch_test
      POSTGRES_USER: nurturepatch_test
      POSTGRES_PASSWORD: test_only_password
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nurturepatch_test -d nurturepatch_test"]
      interval: 5s
      timeout: 5s
      retries: 5
